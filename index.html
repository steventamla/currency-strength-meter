<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><link rel="manifest" href="manifest.json"><title>Currency Strength</title><style>
:root{--bg:#071522;--panel:#0d2232;--line:#294154;--muted:#9ab0c3;--text:#edf5fc;--blue:#2187ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#10283a,var(--bg) 65%);color:var(--text);font:15px system-ui,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 4%;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}.sub,.muted{font-size:12px;color:var(--muted)}button,input{font:inherit}button{cursor:pointer;border:1px solid #345064;background:#122a3d;color:var(--text);border-radius:9px;padding:9px 13px}.primary,.active{background:var(--blue);border-color:var(--blue)}main{max-width:1300px;margin:auto;padding:18px}.tabs{display:flex;gap:7px;margin-bottom:14px}.panel{background:#0b1d2c;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.chip{background:#081a29;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.code{font-weight:800}.val{font-size:23px;font-weight:750}.chart{height:260px}.chart svg{width:100%;height:100%}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.legend span{white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.empty{text-align:center;color:var(--muted);padding:30px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:12px;z-index:5}.modal.open{display:flex}.box{width:min(700px,100%);max-height:92vh;overflow:auto;background:#0b1d2c;border:1px solid var(--line);border-radius:15px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field{background:#081a29;padding:9px;border-radius:9px;border:1px solid var(--line)}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input{width:100%;padding:9px;background:#102638;color:white;border:1px solid #345064;border-radius:7px}.history{padding:12px 0;border-top:1px solid var(--line)}@media(max-width:600px){.scores{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}main{padding:12px}.chart{height:230px}}
</style></head><body><header class="top"><div><h1>CURRENCY STRENGTH</h1><div class="sub">Manual final scores · Daily & 4H</div></div><button id="gear" aria-label="Enter scores" title="Enter scores">⚙</button></header><main><div class="row" style="margin-bottom:12px"><div class="tabs"><button class="active" data-tf="Daily">DAILY</button><button data-tf="4H">4H</button></div><span id="stamp" class="muted">No scores saved</span></div><section class="panel"><div class="row"><strong id="chartTitle">Daily · Score history</strong><span class="muted">Final scores only</span></div><div id="chart" class="chart"></div><div id="legend" class="legend"></div></section><section class="panel"><div class="row"><strong>Latest final scores</strong><span id="scoreTF" class="muted">Daily</span></div><div id="scores" class="scores"></div><div id="empty" class="empty">Use ⚙ to enter your first scores.</div></section><section class="panel"><strong>History</strong><div id="history"></div></section></main><div id="modal" class="modal"><div class="box"><div class="row"><strong>Enter final scores</strong><button id="close">✕</button></div><p class="muted">Enter manually calculated totals from −6 to +6.</p><form id="form"><h3>DAILY</h3><div id="daily" class="grid"></div><h3>4H</h3><div id="four" class="grid"></div><div class="row" style="justify-content:flex-end;margin-top:15px"><button type="button" id="cancel">Cancel</button><button class="primary">Save scores</button></div></form></div></div><script>
const cs=[['USD','#00df78'],['EUR','#2187ff'],['GBP','#ff4c59'],['JPY','#ffd21f'],['CHF','#21e2e7'],['CAD','#ff941f'],['AUD','#ad58ff'],['NZD','#ff6bc6']],key='currency-strength-sessions-v1';let data=read(),tf='Daily';function read(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function save(){localStorage.setItem(key,JSON.stringify(data))}function latest(){return data[data.length-1]}function date(d){return new Date(d).toLocaleString()}function fields(id,vals){document.getElementById(id).innerHTML=cs.map(([c,col])=>'<div class="field"><label style="color:'+col+'" for="'+id+c+'">'+c+'</label><input id="'+id+c+'" name="'+c+'" type="number" min="-6" max="6" step="1" required value="'+(vals?.[c]??0)+'"></div>').join('')}function open(){let l=latest();fields('daily',l?.Daily);fields('four',l?.['4H']);modal.classList.add('open')}function close(){modal.classList.remove('open')}gear.onclick=open;document.getElementById('close').onclick=close;cancel.onclick=close;document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{tf=b.dataset.tf;document.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('active',x===b));render()});form.onsubmit=e=>{e.preventDefault();let get=id=>Object.fromEntries(cs.map(([c])=>[c,Number(document.querySelector('#'+id+' [name="'+c+'"]').value)]));let Daily=get('daily'),H=get('four');if([...Object.values(Daily),...Object.values(H)].some(v=>!Number.isInteger(v)||v< -6||v>6)){alert('Use whole numbers from -6 to +6');return}data.push({id:Date.now().toString(),date:new Date().toISOString(),Daily,'4H':H});save();close();render()};function render(){let l=latest();stamp.textContent=l?'Latest: '+date(l.date):'No scores saved';chartTitle.textContent=tf+' · Score history';scoreTF.textContent=tf;empty.style.display=l?'none':'block';scores.innerHTML=l?cs.map(([c,col])=>'<div class="chip"><div class="code" style="color:'+col+'">'+c+'</div><div class="val">'+(l[tf][c]>0?'+':'')+l[tf][c]+'</div></div>').join(''):'';draw();history.innerHTML=data.length?[...data].reverse().map(s=>'<div class="history row"><span>'+date(s.date)+'</span><button data-view="'+s.id+'">View</button> <button data-del="'+s.id+'">Delete</button></div>').join(''):'<div class="empty">No history yet.</div>';history.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{let s=data.find(x=>x.id===b.dataset.view);alert(date(s.date)+'\n\nDAILY\n'+cs.map(([c])=>c+': '+s.Daily[c]).join('\n')+'\n\n4H\n'+cs.map(([c])=>c+': '+s['4H'][c]).join('\n'))});history.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this session?')){data=data.filter(s=>s.id!==b.dataset.del);save();render()}})}function draw(){if(!data.length){chart.innerHTML='<div class="empty">Saved score history will appear here.</div>';legend.innerHTML=cs.map(([c,col])=>'<span><i class="dot" style="background:'+col+'"></i>'+c+'</span>').join('');return}let W=850,H=250,L=34,R=12,T=12,B=26,pw=W-L-R,ph=H-T-B,n=data.length,x=i=>L+(n===1?pw/2:i*pw/(n-1)),y=v=>T+(6-v)/12*ph,o='';for(let v=-6;v<=6;v+=2){let yy=y(v);o+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="'+(v===0?'#9ab0c3':'#20394b')+'"/><text x="'+(L-8)+'" y="'+(yy+4)+'" fill="#9ab0c3" font-size="11" text-anchor="end">'+v+'</text>'}let ticks=[...new Set([0,Math.floor((n-1)/2),n-1])];ticks.forEach(i=>o+='<text x="'+x(i)+'" y="'+(H-6)+'" fill="#9ab0c3" font-size="10" text-anchor="middle">'+new Date(data[i].date).toLocaleDateString([],{month:'short',day:'numeric'})+'</text>');cs.forEach(([c,col])=>{o+='<polyline points="'+data.map((s,i)=>x(i)+','+y(s[tf][c])).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round"/>';o+='<circle cx="'+x(n-1)+'" cy="'+y(data[n-1][tf][c])+'" r="3.5" fill="'+col+'"/>'});chart.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+o+'</svg>';legend.innerHTML=cs.map(([c,col])=>'<span><i class="dot" style="background:'+col+'"></i>'+c+'</span>').join('')}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
