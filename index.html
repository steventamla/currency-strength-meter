<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><link rel="manifest" href="manifest.json"><title>Currency Strength</title><style>:root{--bg:#07111f;--panel:#101f36;--line:#304765;--muted:#b2c5df;--text:#f5f8ff;--blue:#397bff;--glow:#20d9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#203d77 0%,transparent 38%),radial-gradient(ellipse at 95% 12%,#48266e 0%,transparent 30%),linear-gradient(145deg,#07111f,#0a1428 60%,#10152e);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 4%;border-bottom:1px solid #365071;background:linear-gradient(90deg,#102644dd,#1b1c3ddd);box-shadow:0 8px 30px #0005}h1{font-size:22px;letter-spacing:1.7px;margin:0;background:linear-gradient(90deg,#fff,#65dcff,#bfa4ff);color:transparent;background-clip:text}.sub,.muted{font-size:12px;color:var(--muted)}button,input{font:inherit}button{cursor:pointer;border:1px solid #47658c;background:linear-gradient(135deg,#1a3150,#202846);color:var(--text);border-radius:11px;padding:10px 15px;transition:transform .15s,border-color .15s,filter .15s}button:hover{transform:translateY(-1px);border-color:#63cfff;filter:brightness(1.15)}#gear{font-size:20px;background:linear-gradient(135deg,#347dff,#914dff);border:0;box-shadow:0 4px 20px #347dff66}.primary,.active{background:linear-gradient(120deg,#347dff,#8b4dff);border-color:transparent;box-shadow:0 4px 15px #347dff44}main{max-width:1300px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;margin-bottom:14px}.panel{background:linear-gradient(145deg,#132640f2,#111b31f5);border:1px solid #354b70;border-radius:18px;padding:17px;margin-bottom:16px;box-shadow:0 12px 35px #0003,inset 0 1px #ffffff09}.panel strong{font-size:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.chip{background:linear-gradient(145deg,#1a2e4a,#101b30);border:1px solid #3a5277;border-radius:13px;padding:13px 10px;text-align:center;box-shadow:inset 0 1px #ffffff0b}.code{font-weight:850;letter-spacing:.8px}.val{font-size:26px;font-weight:800;margin-top:3px}.chart{height:290px;margin-top:12px}.chart svg{width:100%;height:100%;overflow:visible}.legend{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;font-size:12px;line-height:1.5;margin-top:12px;padding:8px 4px 2px;max-width:100%;overflow:visible}.legend .legend-item{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:#e3ecff;flex:0 0 auto;padding:3px 2px}.dot{display:inline-block;flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin:0;box-shadow:0 0 9px currentColor}.empty{text-align:center;color:var(--muted);padding:34px 15px;background:#0a172a88;border-radius:12px;margin-top:12px}.modal{display:none;position:fixed;inset:0;background:#020713d9;backdrop-filter:blur(9px);align-items:center;justify-content:center;padding:12px;z-index:5}.modal.open{display:flex}.box{width:min(700px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#172b49,#0c172a);border:1px solid #52709a;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0009}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field{background:linear-gradient(145deg,#152844,#0b182b);padding:10px;border-radius:11px;border:1px solid #344b6d}.field label{display:block;font-weight:850;font-size:12px;margin-bottom:6px;letter-spacing:.5px}.field input{width:100%;padding:10px;background:#071426;color:white;border:1px solid #3c5a80;border-radius:8px;outline:none}.field input:focus{border-color:#55d8ff;box-shadow:0 0 0 3px #55d8ff22}.box h3{color:#7fdfff;letter-spacing:1px}.history{padding:12px 0;border-top:1px solid #2c4260}.history button{padding:7px 11px;font-size:12px}@media(max-width:600px){.top{padding:16px 4%}.scores{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}main{padding:12px}.chart{height:245px}.panel{padding:13px}.val{font-size:24px}}.crosshair{stroke:#fff;stroke-width:1.2;stroke-dasharray:5 4}.line-label{font-size:11px;font-weight:800;paint-order:stroke;stroke:#0b1728;stroke-width:3px}.filtergrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-top:14px}.filtercol{display:flex;flex-direction:column;min-width:0}.filtercol .currlist{order:1}.filtercol label{order:0;margin-bottom:6px}.filtercol .save-under{order:2;align-self:flex-start;margin-top:10px}.filtergrid .filteractions{display:none}.currlist{width:100%;min-height:160px;background:#0a172a;color:#f5f8ff;border:1px solid #3c5a80;border-radius:10px;padding:8px}.currency-options{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;min-height:100px}.currency-option{min-width:64px;min-height:44px;padding:10px 14px;border-width:1px;background:#10213a;border-radius:10px;font-weight:800;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.currency-option:active{transform:scale(.96);filter:brightness(1.25)}.filtercol .currlist{height:auto;max-height:none;overflow:visible}.filteractions{display:flex;flex-direction:column;gap:8px}.crossnote{font-size:12px;color:#b2c5df;margin-top:6px}@media(max-width:600px){.filtergrid{grid-template-columns:1fr}.filteractions{flex-direction:row;justify-content:center}}</style></head><body><header class="top"><div><h1>CURRENCY STRENGTH</h1></div><button id="gear" aria-label="Enter scores" title="Enter scores">⚙</button></header><main><div class="row" style="margin-bottom:12px"><div class="tabs"><button class="active" data-tf="Daily">DAILY</button><button data-tf="4H">4H</button></div><span id="stamp" class="muted">No scores saved</span></div><section class="panel"><div id="chart" class="chart"></div><div id="legend" class="legend"></div></section><section class="panel"><div class="row"><strong>Currency filters</strong><span class="muted">Choose currencies to compare</span></div><div class="filtergrid"><div class="filtercol"><label for="excluded" class="muted">Excluded</label><div id="excluded" class="currlist currency-options"></div><button id="saveFilters" type="button" class="primary save-under">Save</button></div><div class="filtercol"><label for="included" class="muted">Included</label><div id="included" class="currlist currency-options"></div></div></div></section></main><div id="modal" class="modal"><div class="box"><div class="row"><strong>Enter final scores</strong><button id="close">✕</button></div><p class="muted">Enter manually calculated totals from −7 to +7.</p><form id="form"><h3>DAILY</h3><div id="daily" class="grid"></div><h3>4H</h3><div id="four" class="grid"></div><div class="row" style="justify-content:flex-end;margin-top:15px"><button type="button" id="cancel">Cancel</button><button class="primary">Save scores</button></div></form></div></div><script>
const SUPABASE_URL='https://koccgperbrnacntqfeky.supabase.co';
const SUPABASE_KEY='sb_publishable_hrbdRPneH9WEMXG8Wf24lw_XKaEYT-Z';
const cs=[['USD','#00df78'],['EUR','#2187ff'],['GBP','#ff4c59'],['JPY','#ffd21f'],['CHF','#21e2e7'],['CAD','#ff941f'],['AUD','#ad58ff'],['NZD','#ff6bc6']],key='currency-strength-sessions-v2';let data=read(),tf='Daily',includedCurrencies=readFilters(),remoteStamp='';
async function supabaseRequest(path,options={}){const response=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok)throw new Error('Supabase '+response.status+': '+(await response.text()));return response.status===204?null:response.json()}
async function pushScores(session){const rows=[];for(const [currency] of cs){for(const timeframe of ['Daily','4H'])rows.push({currency,timeframe,score:Number(session[timeframe][currency]),updated_at:session.date})}await supabaseRequest('currency_scores?on_conflict=currency%2Ctimeframe',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}
async function pullScores(){const rows=await supabaseRequest('currency_scores?select=currency,timeframe,score,updated_at&order=updated_at.desc');if(!rows||!rows.length)return;const newest=rows[0].updated_at||'';if(newest&&newest===remoteStamp)return;remoteStamp=newest;const Daily={},H={};for(const [currency] of cs){Daily[currency]=0;H[currency]=0}for(const row of rows){if(!(row.currency in Daily))continue;if(row.timeframe==='Daily')Daily[row.currency]=Number(row.score);if(row.timeframe==='4H')H[row.currency]=Number(row.score)}const session={id:'remote-'+(newest||Date.now()),date:newest||new Date().toISOString(),Daily,'4H':H};const latestLocal=data.length?data[data.length-1]:null;if(!latestLocal||new Date(session.date).getTime()>new Date(latestLocal.date).getTime()){data=data.filter(s=>s.id!==session.id);data.push(session);save();render()}}
async function syncOnLoad(){try{await pullScores()}catch(e){console.error(e);stamp.textContent='Supabase sync error — check connection/settings'}}
setInterval(()=>{pullScores().catch(e=>console.error('Supabase sync failed',e))},10000);function readFilters(){try{const a=JSON.parse(localStorage.getItem('currency-strength-included-v1')||'null');return Array.isArray(a)?cs.map(x=>x[0]).filter(v=>a.includes(v)):cs.map(x=>x[0])}catch{return cs.map(x=>x[0])}}function read(){try{const saved=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(saved)?saved.filter(s=>s&&s.id&&!String(s.id).startsWith('demo-')&&s.date&&s.Daily&&s['4H']):[]}catch{return []}}function save(){localStorage.setItem(key,JSON.stringify(data))}function latest(){return data[data.length-1]}function date(d){return new Date(d).toLocaleString()}function fields(id,vals){document.getElementById(id).innerHTML=cs.map(([c,col])=>'<div class="field"><label style="color:'+col+'" for="'+id+c+'">'+c+'</label><input id="'+id+c+'" name="'+c+'" type="number" min="-7" max="7" step="1" required value="'+(vals?.[c]??0)+'"></div>').join('')}function open(){let l=latest();fields('daily',l?.Daily);fields('four',l?.['4H']);modal.classList.add('open')}function close(){modal.classList.remove('open')}gear.onclick=open;document.getElementById('close').onclick=close;cancel.onclick=close;document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{tf=b.dataset.tf;document.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('active',x===b));render()});form.onsubmit=e=>{e.preventDefault();let get=id=>Object.fromEntries(cs.map(([c])=>[c,Number(document.querySelector('#'+id+' [name="'+c+'"]').value)]));let Daily=get('daily'),H=get('four');if([...Object.values(Daily),...Object.values(H)].some(v=>!Number.isInteger(v)||v< -7||v>7)){alert('Use whole numbers from -7 to +7');return}const session={id:Date.now().toString(),date:new Date().toISOString(),Daily,'4H':H};data.push(session);save();close();render();pushScores(session).then(()=>{remoteStamp=session.date;stamp.textContent='Saved and synced: '+date(session.date)}).catch(err=>{console.error(err);alert('Saved on this device, but Supabase sync failed: '+err.message)})};function render(){stamp.textContent=data.length?'Latest saved: '+date(latest().date):'No scores saved';draw()}function draw(){
if(!data.length){chart.innerHTML='<div class="empty">No scores recorded yet. Enter and save your first genuine Daily and 4H scores to begin the chart.</div>';legend.innerHTML='';return}
const visible=cs.filter(([cur])=>includedCurrencies.includes(cur));
if(!visible.length){chart.innerHTML='<div class="empty">Include at least one currency to display the chart.</div>';legend.innerHTML='';return}
let W=900,H=290,L=52,R=100,T=18,B=28,pw=W-L-R,ph=H-T-B,n=data.length;
const x=i=>L+(n===1?pw/2:i*pw/(n-1)),y=v=>T+(7-v)/14*ph;
let o='';
for(const v of [-7,-5,0,5,7]){let yy=y(v);o+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R+2)+'" y2="'+yy+'" stroke="'+(v===0?'#8ca8c8':'#263d59')+'"/><text x="'+(L-9)+'" y="'+(yy+4)+'" fill="#9ab0c8" font-size="11" text-anchor="end">'+v+'</text>'}
[...new Set([0,Math.floor((n-1)/2),n-1])].forEach(i=>o+='<text x="'+x(i)+'" y="'+(H-7)+'" fill="#9ab0c8" font-size="10" text-anchor="middle">'+new Date(data[i].date).toLocaleDateString([],{year:'numeric',month:'short',day:'numeric'})+'</text>');
visible.forEach(([cur,col])=>{let pts=data.map((s,i)=>x(i)+','+y(Number(s[tf][cur])||0)).join(' ');o+='<polyline class="visline" points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" data-cur="'+cur+'"/>'});
o+='<line id="crosshair" class="crosshair" x1="'+x(n-1)+'" y1="'+T+'" x2="'+x(n-1)+'" y2="'+(H-B)+'" opacity="0"/><g id="rankLabels" visibility="hidden"></g><text id="hoverDate" x="'+x(n-1)+'" y="'+(H-7)+'" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle" visibility="hidden"></text>';
chart.innerHTML='<svg id="strengthSvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+o+'</svg>';
const svg=document.getElementById('strengthSvg'),cross=svg.querySelector('#crosshair'),labels=svg.querySelector('#rankLabels'),dateLabel=svg.querySelector('#hoverDate');
function at(i){i=Math.max(0,Math.min(n-1,i));cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.setAttribute('opacity','1');dateLabel.setAttribute('x',x(i));dateLabel.setAttribute('visibility','visible');dateLabel.textContent=new Date(data[i].date).toLocaleDateString([],{year:'numeric',month:'short',day:'numeric'});const ranked=visible.map(([cur,col])=>({cur,col,score:Number(data[i][tf][cur])||0})).sort((a,b)=>b.score-a.score);const step=Math.min(25,(ph-24)/Math.max(1,ranked.length-1)),top=T+16;labels.innerHTML=ranked.map((v,j)=>'<circle cx="'+(x(i)+9)+'" cy="'+(top+j*step-4)+'" r="4" fill="'+v.col+'"/><text class="line-label" x="'+(x(i)+18)+'" y="'+(top+j*step)+'" fill="'+v.col+'">'+v.cur+' '+(v.score>0?'+':'')+v.score+'</text>').join('');labels.setAttribute('visibility','visible')}
function hideHover(){cross.setAttribute('opacity','0');dateLabel.setAttribute('visibility','hidden');labels.setAttribute('visibility','hidden');labels.innerHTML=''}
function choose(evt){const rect=svg.getBoundingClientRect(),viewX=(evt.clientX-rect.left)/rect.width*W,viewY=(evt.clientY-rect.top)/rect.height*H;if(viewX<L||viewX>W-R||viewY<T||viewY>H-B){hideHover();return}const raw=n===1?0:Math.max(0,Math.min(n-1,(viewX-L)/pw*(n-1))),lo=Math.floor(raw),hi=Math.min(n-1,lo+1),frac=raw-lo;let nearest=Infinity;visible.forEach(([cur])=>{const a=Number(data[lo][tf][cur])||0,b=Number(data[hi][tf][cur])||0,lineY=y(a+(b-a)*frac);nearest=Math.min(nearest,Math.abs(lineY-viewY))});if(nearest>9){hideHover();return}at(Math.round(raw))}
svg.addEventListener('pointermove',choose);svg.addEventListener('pointerdown',choose);svg.addEventListener('pointerleave',hideHover);hideHover();
legend.innerHTML=visible.map(([cur,col])=>'<span class="legend-item" tabindex="0" data-cur="'+cur+'" style="cursor:pointer"><i class="dot" style="background:'+col+';color:'+col+'"></i>'+cur+'</span>').join('');
function highlightCurrency(cur){svg.querySelectorAll('.visline').forEach(line=>{const active=line.dataset.cur===cur;line.setAttribute('stroke-width',active?'5':'1.5');line.setAttribute('opacity',active?'1':'0.22');line.style.filter=active?'drop-shadow(0 0 5px '+(cs.find(v=>v[0]===cur)?.[1]||'#fff')+')':'none'})}
function clearHighlight(){svg.querySelectorAll('.visline').forEach(line=>{line.setAttribute('stroke-width','2.5');line.setAttribute('opacity','1');line.style.filter='none'})}
legend.querySelectorAll('.legend-item').forEach(item=>{item.addEventListener('pointerenter',()=>highlightCurrency(item.dataset.cur));item.addEventListener('pointerleave',clearHighlight);item.addEventListener('focus',()=>highlightCurrency(item.dataset.cur));item.addEventListener('blur',clearHighlight)})
}function paintFilters(){included.innerHTML='';excluded.innerHTML='';cs.forEach(([cur,col])=>{const btn=document.createElement('button');btn.type='button';btn.className='currency-option';btn.textContent=cur;btn.style.borderColor=col;btn.style.color=col;btn.setAttribute('aria-label',(includedCurrencies.includes(cur)?'Exclude ':'Include ')+cur);btn.addEventListener('click',()=>moveCurrency(cur));(includedCurrencies.includes(cur)?included:excluded).appendChild(btn)})}
function moveCurrency(cur){if(includedCurrencies.includes(cur))includedCurrencies=includedCurrencies.filter(v=>v!==cur);else includedCurrencies.push(cur);paintFilters();render()}
saveFilters.onclick=()=>{localStorage.setItem('currency-strength-included-v1',JSON.stringify(includedCurrencies));render()};paintFilters();render();syncOnLoad();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
